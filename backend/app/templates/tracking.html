<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sendungsverfolgung</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:1.25rem;background:#f5f6f7;color:#17202a}main{max-width:38rem;margin:auto;background:white;padding:1.25rem;border-radius:12px;box-shadow:0 2px 10px #0001}h1{font-size:1.4rem}.value{font-size:1.15rem;margin:.8rem 0}.map{padding:1rem;background:#eef1f3;border-radius:8px;word-break:break-word}</style></head><body><main><h1>Ihre Sendungsverfolgung</h1><div id="status">Warte auf Positionsdaten …</div><div class="value" id="eta"></div><div class="value" id="distance"></div><div class="value" id="updated"></div><div class="map" id="map">Position wird geladen …</div></main><script>const token="__SHARE_TOKEN__";function ago(v){if(!v)return"—";return Math.max(0,Math.round((Date.now()-Date.parse(v))/60000))+" Min. vorher"}async function load(){try{const d=await fetch(`/api/t/${token}`).then(r=>r.json());if(d.waiting){status.textContent="Warte auf Positionsdaten …";return}status.textContent="Status: "+(d.state||"unbekannt");eta.textContent="Ankunft: "+(d.eta||"unbekannt");distance.textContent="Verbleibende Strecke: "+(d.remaining_distance_meters==null?"—":(d.remaining_distance_meters/1000).toFixed(1)+" km");updated.textContent="Aktualisiert: "+ago(d.updated_at);map.textContent=d.latitude==null?"Keine Koordinaten verfügbar":"Position: "+d.latitude+", "+d.longitude}catch(e){status.textContent="Daten derzeit nicht verfügbar"}}load();setInterval(load,30000);</script></body></html>

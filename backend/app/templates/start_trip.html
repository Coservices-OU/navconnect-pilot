<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navigation wird gestartet</title><style>body{font-family:system-ui,sans-serif;margin:0;padding:2rem 1.25rem;background:#f5f6f7;color:#17202a;text-align:center}main{max-width:26rem;margin:auto}.spinner{width:2.5rem;height:2.5rem;border:4px solid #dfe3e6;border-top-color:#1a73e8;border-radius:50%;margin:1.5rem auto;animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.err{color:#b3261e;font-weight:600}</style></head><body><main><h1>Navigation wird gestartet …</h1><div class="spinner" id="spinner"></div><p id="msg">Bitte warten.</p></main><script>
const params = new URLSearchParams(window.location.search);
const lat = parseFloat(params.get('lat'));
const lng = parseFloat(params.get('lng'));
const vehicleLabel = params.get('vehicle_label');
const customerRef = params.get('customer_ref');
const msg = document.getElementById('msg');
const spinner = document.getElementById('spinner');
function fail(text){ spinner.style.display='none'; msg.textContent = text; msg.classList.add('err'); }
if (Number.isNaN(lat) || Number.isNaN(lng)) {
  fail('Fehlende oder ungültige Zielkoordinaten im Link.');
} else {
  fetch('/trips', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      destination_lat: lat,
      destination_lng: lng,
      vehicle_label: vehicleLabel || null,
      customer_ref: customerRef || null
    })
  })
    .then(r => { if (!r.ok) throw new Error('backend_error'); return r.json(); })
    .then(data => {
      if (data && data.driver_link) {
        window.location.href = data.driver_link;
      } else {
        fail('Der Server hat keinen Navigationslink zurückgegeben.');
      }
    })
    .catch(() => fail('Verbindung fehlgeschlagen. Bitte erneut versuchen oder Dispatch kontaktieren.'));
}
</script></body></html>
